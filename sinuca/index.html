<!DOCTYPE html>
<html lang="pt-BR" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sinuca Master 8-Ball</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        canvas {
            display: block;
            touch-action: none;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0,0,0,0.6);
            border-radius: 12px;
        }

        /* Estilização customizada do Slider de Força */
        input[type=range] {
            -webkit-appearance: none;
            background: #334155;
            border-radius: 9999px;
            height: 10px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f59e0b;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input[type=range]::-moz-range-thumb {
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #f59e0b;
            border: 2px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between items-center p-2 sm:p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] pt-[calc(0.5rem+env(safe-area-inset-top))] text-white select-none">

    <!-- 1. PLACAR / TOPO (NÃO ENCOLHE: flex-shrink-0) -->
    <header class="w-full max-w-4xl bg-slate-800/90 backdrop-blur border border-slate-700/60 rounded-xl p-2 sm:p-3 shadow-xl flex items-center justify-between gap-2 shrink-0 z-10">
        <!-- Jogador / Humano -->
        <div id="p1-card" class="flex-1 bg-slate-900/70 p-2 rounded-lg border border-amber-500/40 flex flex-col items-center justify-center transition-all">
            <div class="flex items-center gap-1.5">
                <span id="p1-badge" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="font-bold text-xs sm:text-sm text-amber-400" id="p1-name">Você</span>
            </div>
            <div class="text-[10px] sm:text-xs text-slate-400 mt-0.5" id="p1-type">Qualquer Bola</div>
            <div id="p1-potted" class="flex gap-1 mt-1 min-h-[18px] flex-wrap justify-center"></div>
        </div>

        <!-- Status / Centro -->
        <div class="flex flex-col items-center justify-center px-1 sm:px-3 text-center min-w-[100px] sm:min-w-[130px]">
            <span class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Sinuca Master</span>
            <div id="game-status" class="text-xs sm:text-sm font-extrabold text-amber-300 my-0.5 whitespace-nowrap">Sua Vez</div>
            <button id="btn-restart" class="text-[11px] bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-200 px-2.5 py-0.5 rounded-full border border-slate-500/40 transition active:scale-95">
                Novo Jogo
            </button>
        </div>

        <!-- Oponente (Robô IA ou Treino) -->
        <div id="p2-card" class="flex-1 bg-slate-900/70 p-2 rounded-lg border border-transparent flex flex-col items-center justify-center transition-all opacity-60">
            <div class="flex items-center gap-1.5">
                <span id="p2-badge" class="w-2.5 h-2.5 rounded-full bg-slate-600"></span>
                <span class="font-bold text-xs sm:text-sm text-blue-400" id="p2-name">Robô IA</span>
            </div>
            <div class="text-[10px] sm:text-xs text-slate-400 mt-0.5" id="p2-type">Qualquer Bola</div>
            <div id="p2-potted" class="flex gap-1 mt-1 min-h-[18px] flex-wrap justify-center"></div>
        </div>
    </header>

    <!-- 2. ÁREA CENTRAL DO CANVAS (EXPANDE E SE AJUSTA DINAMICAMENTE) -->
    <main id="canvas-container" class="flex-1 w-full flex items-center justify-center my-1 sm:my-2 relative overflow-hidden max-w-5xl">
        <canvas id="poolCanvas"></canvas>

        <!-- Overlay de Mensagens do Jogo -->
        <div id="toast" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none opacity-0 transition-opacity duration-300 bg-black/85 border border-amber-500/50 text-amber-300 px-5 py-2.5 rounded-2xl text-sm sm:text-base font-bold shadow-2xl text-center z-20">
            Mensagem
        </div>
    </main>

    <!-- 3. RODAPÉ / PAINEL DE CONTROLES (NÃO ENCOLHE: flex-shrink-0) -->
    <footer class="w-full max-w-4xl bg-slate-800/90 backdrop-blur border border-slate-700/60 rounded-xl p-2 sm:p-3 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-4 shrink-0 z-10">
        
        <!-- Seleção de Modo -->
        <div class="flex items-center justify-between sm:justify-start gap-2 w-full sm:w-auto">
            <label class="text-xs font-semibold text-slate-300 whitespace-nowrap">Modo:</label>
            <select id="mode-select" class="bg-slate-900 text-amber-400 text-xs font-bold rounded-lg px-2.5 py-1.5 border border-slate-700 focus:outline-none focus:border-amber-500 cursor-pointer">
                <option value="cpu">Contra Robô (IA)</option>
                <option value="practice">Treino Livre</option>
            </select>
        </div>

        <!-- Slider de Força -->
        <div class="flex items-center gap-2.5 w-full sm:flex-1 max-w-md px-1">
            <span class="text-xs font-semibold text-slate-300 whitespace-nowrap">Força:</span>
            <input type="range" id="power-slider" min="5" max="100" value="40" class="w-full cursor-pointer">
            <span id="power-val" class="text-xs font-bold text-amber-400 min-w-[34px] text-right">40%</span>
        </div>

        <!-- Botão de Tacada -->
        <button id="btn-shoot" class="w-full sm:w-auto bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black text-xs sm:text-sm px-6 py-2 rounded-lg shadow-lg transition active:scale-95 disabled:opacity-40 whitespace-nowrap">
            DAR TACADA
        </button>
    </footer>

    <!-- MODAL FIM DE JOGO -->
    <div id="modal-winner" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border-2 border-amber-500/50 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-2">🏆</div>
            <h2 id="winner-title" class="text-xl sm:text-2xl font-black text-amber-400 mb-1">Você Venceu!</h2>
            <p id="winner-desc" class="text-slate-300 text-xs sm:text-sm mb-5">Encaçapou a bola 8 com sucesso!</p>
            <button id="btn-modal-restart" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-2.5 rounded-xl transition shadow-lg active:scale-95">
                Jogar Novamente
            </button>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL DO JOGO -->
    <script>
        // =========================================================================
        // 1. SINTETIZADOR DE ÁUDIO PROCEDURAL (WEB AUDIO API)
        // =========================================================================
        class SoundManager {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playHit(volume = 1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(130, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(Math.min(volume, 1) * 0.8, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playCushion(volume = 1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(85, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.09);

                gain.gain.setValueAtTime(Math.min(volume, 1) * 0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.09);
            }

            playPocket() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(280, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(55, this.ctx.currentTime + 0.22);

                gain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            }

            playWin() {
                if (!this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + idx * 0.1);
                    osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                });
            }
        }

        const soundManager = new SoundManager();

        // =========================================================================
        // 2. CONFIGURAÇÕES E ESTADO DO JOGO
        // =========================================================================
        const canvas = document.getElementById('poolCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Dimensões nominais internas da mesa (Proporção 2:1)
        const TABLE_WIDTH = 1000;
        const TABLE_HEIGHT = 500;
        const MARGIN = 50; // Largura das bordas de madeira
        const BALL_RADIUS = 10.5;
        const POCKET_RADIUS = 22;
        const FRICTION = 0.986;

        const BALL_COLORS = {
            1: '#facc15', 2: '#2563eb', 3: '#dc2626', 4: '#7e22ce',
            5: '#f97316', 6: '#16a34a', 7: '#991b1b', 8: '#0f172a',
            9: '#facc15', 10: '#2563eb', 11: '#dc2626', 12: '#7e22ce',
            13: '#f97316', 14: '#16a34a', 15: '#991b1b'
        };

        // Estado do jogo
        let scale = 1;
        let balls = [];
        let cueBall = null;
        let pockets = [];
        let gameMode = 'cpu';
        let currentPlayer = 1; // 1: Humano, 2: IA
        let playerTypes = { 1: null, 2: null }; // 'solid', 'stripe'
        let pottedThisTurn = [];
        let firstHitBall = null;
        let isAiming = false;
        let aimAngle = 0;
        let isMoving = false;
        let isBallInHand = false;
        let gameOver = false;

        // UI Elementos
        const p1Card = document.getElementById('p1-card');
        const p2Card = document.getElementById('p2-card');
        const p1Name = document.getElementById('p1-name');
        const p2Name = document.getElementById('p2-name');
        const p1Type = document.getElementById('p1-type');
        const p2Type = document.getElementById('p2-type');
        const p1Potted = document.getElementById('p1-potted');
        const p2Potted = document.getElementById('p2-potted');
        const gameStatus = document.getElementById('game-status');
        const powerSlider = document.getElementById('power-slider');
        const powerVal = document.getElementById('power-val');
        const btnShoot = document.getElementById('btn-shoot');
        const modeSelect = document.getElementById('mode-select');
        const toast = document.getElementById('toast');
        const modalWinner = document.getElementById('modal-winner');

        // =========================================================================
        // 3. CLASSE BOLA DE SINUCA
        // =========================================================================
        class Ball {
            constructor(x, y, number) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.number = number;
                this.radius = BALL_RADIUS;
                this.isPotted = false;
                this.color = number === 0 ? '#ffffff' : BALL_COLORS[number];
                this.isStripe = number > 8;
            }

            update() {
                if (this.isPotted) return;

                this.x += this.vx;
                this.y += this.vy;

                this.vx *= FRICTION;
                this.vy *= FRICTION;

                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                this.checkCushionCollisions();
            }

            checkCushionCollisions() {
                const minX = MARGIN + this.radius;
                const maxX = TABLE_WIDTH + MARGIN - this.radius;
                const minY = MARGIN + this.radius;
                const maxY = TABLE_HEIGHT + MARGIN - this.radius;

                let hit = false;

                if (this.x < minX) {
                    this.x = minX;
                    this.vx *= -0.95;
                    hit = true;
                } else if (this.x > maxX) {
                    this.x = maxX;
                    this.vx *= -0.95;
                    hit = true;
                }

                if (this.y < minY) {
                    this.y = minY;
                    this.vy *= -0.95;
                    hit = true;
                } else if (this.y > maxY) {
                    this.y = maxY;
                    this.vy *= -0.95;
                    hit = true;
                }

                if (hit) {
                    const speed = Math.hypot(this.vx, this.vy);
                    if (speed > 0.5) soundManager.playCushion(speed / 15);
                }
            }

            draw() {
                if (this.isPotted) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Sombra da bola
                ctx.beginPath();
                ctx.arc(3, 3, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fill();

                // Corpo
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.isStripe ? '#ffffff' : this.color;
                ctx.fill();

                // Faixa (se listrada)
                if (this.isStripe) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, -Math.PI / 3, Math.PI / 3);
                    ctx.arc(0, 0, this.radius, (2 * Math.PI) / 3, (4 * Math.PI) / 3);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }

                // Círculo numérico
                if (this.number !== 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.number.toString(), 0, 0.5);
                }

                // Brilho 3D
                const grad = ctx.createRadialGradient(
                    -this.radius * 0.3, -this.radius * 0.3, 1,
                    0, 0, this.radius
                );
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
                grad.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');

                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.restore();
            }
        }

        // =========================================================================
        // 4. SETUP E MESA
        // =========================================================================
        function initPockets() {
            pockets = [
                { x: MARGIN + 4, y: MARGIN + 4 },
                { x: MARGIN + TABLE_WIDTH / 2, y: MARGIN - 2 },
                { x: MARGIN + TABLE_WIDTH - 4, y: MARGIN + 4 },
                { x: MARGIN + 4, y: MARGIN + TABLE_HEIGHT - 4 },
                { x: MARGIN + TABLE_WIDTH / 2, y: MARGIN + TABLE_HEIGHT + 2 },
                { x: MARGIN + TABLE_WIDTH - 4, y: MARGIN + TABLE_HEIGHT - 4 }
            ];
        }

        function setupRack() {
            balls = [];
            cueBall = new Ball(MARGIN + TABLE_WIDTH * 0.25, MARGIN + TABLE_HEIGHT / 2, 0);
            balls.push(cueBall);

            const startX = MARGIN + TABLE_WIDTH * 0.72;
            const startY = MARGIN + TABLE_HEIGHT / 2;
            
            const rackOrder = [
                1,
                10, 2,
                3, 8, 11,
                12, 5, 14, 4,
                13, 7, 15, 6, 9
            ];

            let index = 0;
            const rowSpacing = BALL_RADIUS * Math.sqrt(3) + 0.5;

            for (let col = 0; col < 5; col++) {
                const x = startX + col * rowSpacing;
                const startRowY = startY - col * BALL_RADIUS;

                for (let row = 0; row <= col; row++) {
                    const y = startRowY + row * (BALL_RADIUS * 2 + 0.5);
                    balls.push(new Ball(x, y, rackOrder[index++]));
                }
            }
        }

        function resetGame() {
            gameMode = modeSelect.value;
            currentPlayer = 1;
            playerTypes = { 1: null, 2: null };
            isBallInHand = false;
            gameOver = false;
            setupRack();
            updateUI();
            showToast("Novo jogo iniciado!");
        }

        // =========================================================================
        // 5. COLISÕES E FÍSICA
        // =========================================================================
        function resolveBallCollisions() {
            for (let i = 0; i < balls.length; i++) {
                for (let j = i + 1; j < balls.length; j++) {
                    const b1 = balls[i];
                    const b2 = balls[j];

                    if (b1.isPotted || b2.isPotted) continue;

                    const dx = b2.x - b1.x;
                    const dy = b2.y - b1.y;
                    const dist = Math.hypot(dx, dy);
                    const minDist = b1.radius + b2.radius;

                    if (dist < minDist) {
                        if (b1 === cueBall && !firstHitBall) firstHitBall = b2;
                        if (b2 === cueBall && !firstHitBall) firstHitBall = b1;

                        const nx = dx / dist;
                        const ny = dy / dist;

                        const overlap = minDist - dist;
                        b1.x -= nx * (overlap / 2);
                        b1.y -= ny * (overlap / 2);
                        b2.x += nx * (overlap / 2);
                        b2.y += ny * (overlap / 2);

                        const kx = b1.vx - b2.vx;
                        const ky = b1.vy - b2.vy;
                        const p = 2 * (nx * kx + ny * ky) / 2;

                        b1.vx -= p * nx;
                        b1.vy -= p * ny;
                        b2.vx += p * nx;
                        b2.vy += p * ny;

                        const impactSpeed = Math.hypot(kx, ky);
                        if (impactSpeed > 0.3) {
                            soundManager.playHit(impactSpeed / 12);
                        }
                    }
                }
            }
        }

        function checkPockets() {
            balls.forEach(ball => {
                if (ball.isPotted) return;

                pockets.forEach(pocket => {
                    const dist = Math.hypot(ball.x - pocket.x, ball.y - pocket.y);
                    if (dist < POCKET_RADIUS) {
                        ball.isPotted = true;
                        ball.vx = 0;
                        ball.vy = 0;

                        if (ball !== cueBall) {
                            pottedThisTurn.push(ball);
                        }
                        soundManager.playPocket();
                    }
                });
            });
        }

        // =========================================================================
        // 6. REGRAS DE JOGO
        // =========================================================================
        function processTurnRules() {
            let switchTurn = true;
            let foul = false;

            if (cueBall.isPotted) {
                foul = true;
                showToast("Falta! Bola branca caiu.");
                cueBall.isPotted = false;
                cueBall.vx = 0;
                cueBall.vy = 0;
                cueBall.x = MARGIN + TABLE_WIDTH * 0.25;
                cueBall.y = MARGIN + TABLE_HEIGHT / 2;
                isBallInHand = true;
            }

            if (!firstHitBall && !cueBall.isPotted) {
                foul = true;
                showToast("Falta! Nenhuma bola foi atingida.");
                isBallInHand = true;
            }

            const eightBallPotted = pottedThisTurn.some(b => b.number === 8);
            if (eightBallPotted) {
                const pType = playerTypes[currentPlayer];
                const myRemaining = balls.filter(b => !b.isPotted && b.number !== 0 && b.number !== 8 && 
                    (pType === 'solid' ? b.number <= 7 : b.number >= 9)
                );

                if (myRemaining.length === 0 && !foul) {
                    handleWin(currentPlayer, currentPlayer === 1 ? "Você encaçapou a Bola 8!" : "O Robô IA encaçapou a Bola 8!");
                } else {
                    const winner = currentPlayer === 1 ? 2 : 1;
                    handleWin(winner, currentPlayer === 1 ? "Você encaçapou a Bola 8 indevidamente!" : "O Robô encaçapou a Bola 8 indevidamente!");
                }
                return;
            }

            const validPotted = pottedThisTurn.filter(b => b.number !== 0 && b.number !== 8);
            if (!playerTypes[1] && validPotted.length > 0 && !foul) {
                const firstPotted = validPotted[0];
                if (firstPotted.number <= 7) {
                    playerTypes[currentPlayer] = 'solid';
                    playerTypes[currentPlayer === 1 ? 2 : 1] = 'stripe';
                } else {
                    playerTypes[currentPlayer] = 'stripe';
                    playerTypes[currentPlayer === 1 ? 2 : 1] = 'solid';
                }
                const pName = currentPlayer === 1 ? "Você" : "Robô IA";
                showToast(`${pName} ficou com as ${playerTypes[currentPlayer] === 'solid' ? 'Lisas (1-7)' : 'Listradas (9-15)'}!`);
            }

            if (firstHitBall && playerTypes[currentPlayer] && !foul) {
                const targetType = playerTypes[currentPlayer];
                const hitType = firstHitBall.number <= 7 ? 'solid' : 'stripe';
                
                const myRemaining = balls.filter(b => !b.isPotted && b.number !== 0 && b.number !== 8 && 
                    (targetType === 'solid' ? b.number <= 7 : b.number >= 9)
                );

                if (myRemaining.length > 0 && hitType !== targetType && firstHitBall.number !== 8) {
                    foul = true;
                    showToast("Falta! Atingiu a bola do oponente.");
                    isBallInHand = true;
                }
            }

            if (!foul && validPotted.length > 0) {
                const pType = playerTypes[currentPlayer];
                if (!pType) {
                    switchTurn = false;
                } else {
                    const hitCorrectGroup = validPotted.some(b => 
                        pType === 'solid' ? b.number <= 7 : b.number >= 9
                    );
                    if (hitCorrectGroup) switchTurn = false;
                }
            }

            if (switchTurn && gameMode !== 'practice') {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
            }

            updateUI();

            if (gameMode === 'cpu' && currentPlayer === 2 && !gameOver) {
                setTimeout(playCPUTurn, 1000);
            }
        }

        function handleWin(winner, reason) {
            gameOver = true;
            soundManager.playWin();
            const winnerText = winner === 1 ? "Você Venceu! 🎉" : "Robô IA Venceu! 🤖";
            document.getElementById('winner-title').innerText = winnerText;
            document.getElementById('winner-desc').innerText = reason;
            modalWinner.classList.remove('hidden');
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function updateUI() {
            p1Name.innerText = "Você";
            p2Name.innerText = gameMode === 'practice' ? "Treino" : "Robô IA";

            if (gameMode === 'practice') {
                p1Card.classList.remove('opacity-60');
                p1Card.classList.add('border-amber-500/80', 'bg-slate-800');
                p2Card.classList.add('opacity-60', 'border-transparent');
                document.getElementById('p1-badge').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('p2-badge').className = "w-2.5 h-2.5 rounded-full bg-slate-600";
                gameStatus.innerText = "Treino Livre";
            } else if (currentPlayer === 1) {
                p1Card.classList.remove('opacity-60', 'border-transparent');
                p1Card.classList.add('border-amber-500/80', 'bg-slate-800');
                p2Card.classList.add('opacity-60', 'border-transparent');
                document.getElementById('p1-badge').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('p2-badge').className = "w-2.5 h-2.5 rounded-full bg-slate-600";
                gameStatus.innerText = "Sua Vez";
            } else {
                p2Card.classList.remove('opacity-60', 'border-transparent');
                p2Card.classList.add('border-blue-500/80', 'bg-slate-800');
                p1Card.classList.add('opacity-60', 'border-transparent');
                document.getElementById('p2-badge').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('p1-badge').className = "w-2.5 h-2.5 rounded-full bg-slate-600";
                gameStatus.innerText = "Vez da IA";
            }

            p1Type.innerText = playerTypes[1] ? (playerTypes[1] === 'solid' ? 'Lisas (1-7)' : 'Listradas (9-15)') : 'Qualquer Bola';
            p2Type.innerText = playerTypes[2] ? (playerTypes[2] === 'solid' ? 'Lisas (1-7)' : 'Listradas (9-15)') : 'Qualquer Bola';

            renderPottedBallsUI(p1Potted, 1);
            renderPottedBallsUI(p2Potted, 2);
        }

        function renderPottedBallsUI(containerUI, player) {
            containerUI.innerHTML = '';
            const type = playerTypes[player];
            if (!type) return;

            const potted = balls.filter(b => b.isPotted && b.number !== 0 && b.number !== 8 &&
                (type === 'solid' ? b.number <= 7 : b.number >= 9)
            );

            potted.forEach(b => {
                const dot = document.createElement('div');
                dot.className = 'w-3.5 h-3.5 rounded-full border border-white/40 flex items-center justify-center text-[8px] font-bold text-black shadow';
                dot.style.backgroundColor = b.color;
                dot.innerText = b.number;
                containerUI.appendChild(dot);
            });
        }

        // =========================================================================
        // 7. ROBÔ (IA) E TACADAS
        // =========================================================================
        function playCPUTurn() {
            if (isMoving || gameOver || gameMode !== 'cpu') return;

            const cpuType = playerTypes[2];
            let validTargets = balls.filter(b => !b.isPotted && b.number !== 0 && b.number !== 8 &&
                (!cpuType || (cpuType === 'solid' ? b.number <= 7 : b.number >= 9))
            );

            if (validTargets.length === 0) {
                const eight = balls.find(b => b.number === 8 && !b.isPotted);
                if (eight) validTargets = [eight];
            }

            if (validTargets.length === 0) return;

            const target = validTargets[Math.floor(Math.random() * validTargets.length)];
            const angleToTarget = Math.atan2(target.y - cueBall.y, target.x - cueBall.x);
            const errorMargin = (Math.random() - 0.5) * 0.12;
            aimAngle = angleToTarget + errorMargin;

            const power = 35 + Math.random() * 40;
            shoot(power);
        }

        function shoot(power) {
            if (isMoving) return;

            soundManager.init();

            const impulse = power * 0.35;
            cueBall.vx = Math.cos(aimAngle) * impulse;
            cueBall.vy = Math.sin(aimAngle) * impulse;

            isMoving = true;
            isAiming = false;
            pottedThisTurn = [];
            firstHitBall = null;

            soundManager.playHit(power / 60);
        }

        // =========================================================================
        // 8. RENDERIZAÇÃO DA MESA E TACO
        // =========================================================================
        function drawTable() {
            // Moldura externa
            ctx.fillStyle = '#291d0e';
            ctx.beginPath();
            ctx.roundRect(0, 0, canvas.width, canvas.height, 20);
            ctx.fill();

            // Madeira interna
            ctx.fillStyle = '#422a10';
            ctx.beginPath();
            ctx.roundRect(MARGIN - 15, MARGIN - 15, TABLE_WIDTH + 30, TABLE_HEIGHT + 30, 10);
            ctx.fill();

            // Pano Verde
            ctx.fillStyle = '#056537';
            ctx.fillRect(MARGIN, MARGIN, TABLE_WIDTH, TABLE_HEIGHT);

            // Linha de saída
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(MARGIN + TABLE_WIDTH * 0.25, MARGIN);
            ctx.lineTo(MARGIN + TABLE_WIDTH * 0.25, MARGIN + TABLE_HEIGHT);
            ctx.stroke();

            // Caçapas
            pockets.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 3;
                ctx.stroke();
            });
        }

        function drawAimLine() {
            if (!isAiming || isMoving || (gameMode === 'cpu' && currentPlayer === 2)) return;

            const maxLineDist = 380;
            const dirX = Math.cos(aimAngle);
            const dirY = Math.sin(aimAngle);

            ctx.save();
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(cueBall.x, cueBall.y);
            ctx.lineTo(cueBall.x + dirX * maxLineDist, cueBall.y + dirY * maxLineDist);
            ctx.stroke();
            ctx.restore();

            // Taco
            const pVal = parseFloat(powerSlider.value);
            const offset = 20 + (pVal * 0.45);

            ctx.save();
            ctx.translate(cueBall.x, cueBall.y);
            ctx.rotate(aimAngle + Math.PI);

            const cueGrad = ctx.createLinearGradient(offset, 0, offset + 300, 0);
            cueGrad.addColorStop(0, '#fef08a');
            cueGrad.addColorStop(0.02, '#78350f');
            cueGrad.addColorStop(0.7, '#d97706');
            cueGrad.addColorStop(1, '#1e293b');

            ctx.fillStyle = cueGrad;
            ctx.beginPath();
            ctx.moveTo(offset, -2.5);
            ctx.lineTo(offset + 300, -5);
            ctx.lineTo(offset + 300, 5);
            ctx.lineTo(offset, 2.5);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawTable();

            let currentlyMoving = false;
            balls.forEach(ball => {
                ball.update();
                ball.draw();
                if (Math.hypot(ball.vx, ball.vy) > 0) {
                    currentlyMoving = true;
                }
            });

            resolveBallCollisions();
            checkPockets();

            drawAimLine();

            if (isMoving && !currentlyMoving) {
                isMoving = false;
                processTurnRules();
            }

            requestAnimationFrame(gameLoop);
        }

        // =========================================================================
        // 9. RESPONSIVIDADE PRECISA E EVENTOS
        // =========================================================================
        function resizeCanvas() {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            const nativeWidth = TABLE_WIDTH + MARGIN * 2;
            const nativeHeight = TABLE_HEIGHT + MARGIN * 2;

            // Calcular proporção para caber perfeitamente no container sem cortar
            const scaleX = containerWidth / nativeWidth;
            const scaleY = containerHeight / nativeHeight;
            scale = Math.min(scaleX, scaleY, 1);

            canvas.width = nativeWidth;
            canvas.height = nativeHeight;

            canvas.style.width = `${nativeWidth * scale}px`;
            canvas.style.height = `${nativeHeight * scale}px`;
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) / scale,
                y: (clientY - rect.top) / scale
            };
        }

        function handlePointerMove(e) {
            if (isMoving || (gameMode === 'cpu' && currentPlayer === 2)) return;

            const pos = getCanvasPos(e);

            if (isBallInHand) {
                const minX = MARGIN + BALL_RADIUS;
                const maxX = TABLE_WIDTH + MARGIN - BALL_RADIUS;
                const minY = MARGIN + BALL_RADIUS;
                const maxY = TABLE_HEIGHT + MARGIN - BALL_RADIUS;

                cueBall.x = Math.max(minX, Math.min(maxX, pos.x));
                cueBall.y = Math.max(minY, Math.min(maxY, pos.y));
                return;
            }

            aimAngle = Math.atan2(pos.y - cueBall.y, pos.x - cueBall.x);
            isAiming = true;
        }

        function handlePointerDown(e) {
            if (isBallInHand) {
                isBallInHand = false;
                showToast("Bola posicionada!");
                return;
            }
            handlePointerMove(e);
        }

        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mousedown', handlePointerDown);

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });

        canvas.addEventListener('touchstart', (e) => {
            handlePointerDown(e);
        }, { passive: false });

        powerSlider.addEventListener('input', () => {
            powerVal.innerText = `${powerSlider.value}%`;
        });

        btnShoot.addEventListener('click', () => {
            if (!isMoving && (gameMode !== 'cpu' || currentPlayer === 1)) {
                shoot(parseFloat(powerSlider.value));
            }
        });

        document.getElementById('btn-restart').addEventListener('click', resetGame);
        document.getElementById('btn-modal-restart').addEventListener('click', () => {
            modalWinner.classList.add('hidden');
            resetGame();
        });

        modeSelect.addEventListener('change', resetGame);

        // =========================================================================
        // 10. INICIALIZAÇÃO
        // =========================================================================
        window.onload = () => {
            initPockets();
            resizeCanvas();
            resetGame();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
