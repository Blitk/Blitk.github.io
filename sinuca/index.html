<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sinuca 8-Ball Pro</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Estilos personalizados para prevenção de zoom/scroll no touch */
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    /* Estilização customizada da barra de força do slider */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    input[type=range]::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #f59e0b;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body class="bg-gray-950 text-white select-none">

  <!-- Container Principal ajustado para viewport mobile dinâmico -->
  <div class="w-full h-full min-h-[100dvh] max-h-[100dvh] flex flex-col justify-between items-center p-2 box-border pb-[calc(0.5rem+env(safe-area-inset-bottom))] pt-[calc(0.5rem+env(safe-area-inset-top))] overflow-hidden">
    
    <!-- HEADER / PLACAR -->
    <header class="w-full max-w-4xl bg-gray-900/90 border border-gray-800 rounded-xl p-2 md:p-3 flex items-center justify-between shadow-xl flex-shrink-0 z-10 backdrop-blur-md">
      
      <!-- Jogador 1 (Você) -->
      <div id="p1-card" class="flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-emerald-950/60 border border-emerald-500/50 transition-all duration-300">
        <div class="w-7 h-7 md:w-9 md:h-9 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-sm md:text-base shadow">
          P1
        </div>
        <div class="flex flex-col">
          <span class="text-xs md:text-sm font-bold text-emerald-400 leading-none">Você</span>
          <span id="p1-type" class="text-[10px] md:text-xs text-gray-400 mt-0.5">Qualquer Bola</span>
        </div>
      </div>

      <!-- Turno / Status / Modo -->
      <div class="flex flex-col items-center justify-center px-2 text-center">
        <div id="status-badge" class="text-xs md:text-sm font-black tracking-wider uppercase text-amber-400 bg-amber-950/40 px-3 py-1 rounded-full border border-amber-500/30">
          Sua Vez
        </div>
        
        <!-- Seleção de Modo -->
        <div class="mt-1 flex items-center gap-1">
          <select id="game-mode" class="bg-gray-800 text-gray-200 text-[11px] md:text-xs rounded px-2 py-0.5 border border-gray-700 outline-none cursor-pointer">
            <option value="cpu">VS Robô IA</option>
            <option value="practice">Treino Livre</option>
          </select>
          <button id="btn-sound" class="p-1 text-gray-400 hover:text-white rounded bg-gray-800 border border-gray-700">
            <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
          </button>
          <button id="btn-restart" class="p-1 text-gray-400 hover:text-white rounded bg-gray-800 border border-gray-700">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Oponente (Robô / Treino) -->
      <div id="p2-card" class="flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-gray-800/50 border border-transparent transition-all duration-300">
        <div class="flex flex-col items-end">
          <span id="p2-name" class="text-xs md:text-sm font-bold text-gray-300 leading-none">Robô IA</span>
          <span id="p2-type" class="text-[10px] md:text-xs text-gray-400 mt-0.5">Qualquer Bola</span>
        </div>
        <div id="p2-avatar" class="w-7 h-7 md:w-9 md:h-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm md:text-base shadow">
          CPU
        </div>
      </div>

    </header>

    <!-- ÁREA DO CANVAS (MESA DE SINUCA) -->
    <main id="canvas-container" class="w-full flex-1 flex items-center justify-center my-1 relative overflow-hidden">
      <canvas id="pool-canvas" class="rounded-2xl shadow-2xl border-4 border-amber-950/80 cursor-crosshair"></canvas>
      
      <!-- Dica de instrução Desktop/Mobile overlay -->
      <div id="desktop-hint" class="absolute top-2 left-1/2 transform -translate-x-1/2 bg-black/60 backdrop-blur-sm text-gray-300 text-[11px] px-3 py-1 rounded-full border border-white/10 pointer-events-none transition-opacity duration-500 opacity-90 hidden md:block">
        🖱️ <b>PC:</b> Arraste para tras com o botão esquerdo para puxar a taco e solte para dar a tacada.
      </div>
    </main>

    <!-- PAINEL INFERIOR / CONTROLES -->
    <footer class="w-full max-w-4xl bg-gray-900/90 border border-gray-800 rounded-xl p-2 md:p-3 flex items-center justify-between gap-3 shadow-xl flex-shrink-0 z-10 backdrop-blur-md">
      
      <!-- Seletor / Indicador de Bolas Encaçapadas -->
      <div id="potted-balls-container" class="flex items-center gap-1 overflow-x-auto max-w-[30%] py-1">
        <!-- Bolas caídas aparecerão aqui dinamicamente -->
      </div>

      <!-- Slider de Força (Excelente para Mobile) -->
      <div class="flex-1 flex flex-col justify-center max-w-md px-2">
        <div class="flex justify-between items-center text-[11px] md:text-xs text-gray-400 mb-1 font-semibold">
          <span>Força da Tacada</span>
          <span id="power-percentage" class="text-amber-400">0%</span>
        </div>
        <div class="flex items-center gap-2">
          <i data-lucide="zap-off" class="w-4 h-4 text-gray-500"></i>
          <input id="power-range" type="range" min="0" max="100" value="0" class="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-amber-500">
          <i data-lucide="zap" class="w-4 h-4 text-amber-500"></i>
        </div>
      </div>

      <!-- Botão Tacar (Mobile/Touch) -->
      <button id="btn-shoot" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-95 text-gray-950 font-black px-5 py-2.5 rounded-xl shadow-lg flex items-center gap-2 border border-amber-400/50 transition-all">
        <i data-lucide="target" class="w-5 h-5"></i>
        <span class="text-sm uppercase tracking-wider hidden sm:inline">TACAR</span>
      </button>

    </footer>

  </div>

  <!-- SCRIPT PRINCIPAL DO JOGO -->
  <script>
    // --- SINTETIZADOR DE ÁUDIO WEB AUDIO API ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }
      playHit(volume = 1) {
        if (this.muted) return;
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.08);
        
        gain.gain.setValueAtTime(Math.min(volume, 1), this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playCushion() {
        if (this.muted) return;
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      playPocket() {
        if (this.muted) return;
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    const sfx = new SoundEffects();

    // --- CORES DAS BOLAS DA SINUCA ---
    const BALL_COLORS = {
      0: '#FFFFFF', // Branca
      1: '#FACC15', // 1 Amarela
      2: '#2563EB', // 2 Azul
      3: '#DC2626', // 3 Vermelha
      4: '#7C3AED', // 4 Roxa
      5: '#F97316', // 5 Laranja
      6: '#16A34A', // 6 Verde
      7: '#991B1B', // 7 Vinho
      8: '#111827', // 8 Preta
      9: '#FACC15', // 9 Amarela Listrada
      10: '#2563EB', // 10 Azul Listrada
      11: '#DC2626', // 11 Vermelha Listrada
      12: '#7C3AED', // 12 Roxa Listrada
      13: '#F97316', // 13 Laranja Listrada
      14: '#16A34A', // 14 Verde Listrada
      15: '#991B1B'  // 15 Vinho Listrada
    };

    // --- BOLA ---
    class Ball {
      constructor(id, x, y, radius) {
        this.id = id;
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.vx = 0;
        this.vy = 0;
        this.isStriped = id >= 9 && id <= 15;
        this.isCue = id === 0;
        this.isEight = id === 8;
        this.potted = false;
        this.active = true;
      }

      update(friction) {
        if (!this.active || this.potted) return;

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= friction;
        this.vy *= friction;

        if (Math.hypot(this.vx, this.vy) < 0.05) {
          this.vx = 0;
          this.vy = 0;
        }
      }

      draw(ctx) {
        if (!this.active || this.potted) return;

        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        // Sombra Projetada
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 3;

        // Cor Base / Gradiente 3D
        const baseColor = BALL_COLORS[this.id];
        const grad = ctx.createRadialGradient(
          this.x - this.radius * 0.3,
          this.y - this.radius * 0.3,
          this.radius * 0.1,
          this.x,
          this.y,
          this.radius
        );

        if (this.isCue) {
          grad.addColorStop(0, '#FFFFFF');
          grad.addColorStop(1, '#D1D5DB');
          ctx.fillStyle = grad;
          ctx.fill();
        } else if (!this.isStriped) {
          grad.addColorStop(0, '#FFFFFF');
          grad.addColorStop(0.2, baseColor);
          grad.addColorStop(1, '#000000');
          ctx.fillStyle = grad;
          ctx.fill();
        } else {
          // Bola Listrada
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          ctx.clip();
          ctx.beginPath();
          ctx.rect(this.x - this.radius, this.y - this.radius * 0.5, this.radius * 2, this.radius);
          ctx.fillStyle = baseColor;
          ctx.fill();
        }

        ctx.restore();

        // Número da Bola
        if (!this.isCue) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius * 0.42, 0, Math.PI * 2);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          ctx.fillStyle = '#000000';
          ctx.font = `bold ${this.radius * 0.55}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.id.toString(), this.x, this.y + 0.5);
          ctx.restore();
        }
      }
    }

    // --- GAME ENGINE / LÓGICA PRINCIPAL ---
    class Game {
      constructor() {
        this.canvas = document.getElementById('pool-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.container = document.getElementById('canvas-container');

        // Modos: 'cpu', 'practice'
        this.mode = 'cpu';
        this.currentPlayer = 1; // 1 = P1, 2 = CPU/P2
        this.p1Type = null; // 'solid' ou 'striped'
        this.p2Type = null;
        this.turnState = 'aiming'; // 'aiming', 'shooting', 'moving', 'ballInHand', 'gameOver'

        this.balls = [];
        this.pockets = [];
        this.tableBounds = {};
        this.ballRadius = 12;
        this.friction = 0.988;

        // Taco / Mira
        this.aimAngle = 0;
        this.power = 0;
        this.isMouseDown = false;
        this.dragStartPos = { x: 0, y: 0 };
        this.mousePos = { x: 0, y: 0 };

        // Regras / Turno
        this.pottedThisTurn = [];
        this.firstBallHit = null;
        this.foul = false;
        this.message = 'Sua Vez';

        this.initUI();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        this.setupEvents();
        this.resetGame();
        this.loop();
      }

      initUI() {
        lucide.createIcons();

        document.getElementById('game-mode').addEventListener('change', (e) => {
          this.mode = e.target.value;
          this.updatePlayerCards();
          this.resetGame();
        });

        document.getElementById('btn-restart').addEventListener('click', () => this.resetGame());

        document.getElementById('btn-sound').addEventListener('click', (e) => {
          sfx.muted = !sfx.muted;
          const btn = e.currentTarget;
          btn.innerHTML = sfx.muted ? '<i data-lucide="volume-x" class="w-3.5 h-3.5"></i>' : '<i data-lucide="volume-2" class="w-3.5 h-3.5"></i>';
          lucide.createIcons();
        });

        const powerRange = document.getElementById('power-range');
        powerRange.addEventListener('input', (e) => {
          if (this.turnState === 'aiming' && (this.mode === 'practice' || this.currentPlayer === 1)) {
            this.power = parseFloat(e.target.value);
            document.getElementById('power-percentage').innerText = `${Math.round(this.power)}%`;
          }
        });

        document.getElementById('btn-shoot').addEventListener('click', () => {
          if (this.turnState === 'aiming' && this.power > 5 && (this.mode === 'practice' || this.currentPlayer === 1)) {
            this.shoot();
          }
        });
      }

      updatePlayerCards() {
        const p2Name = document.getElementById('p2-name');
        const p2Avatar = document.getElementById('p2-avatar');

        if (this.mode === 'cpu') {
          p2Name.innerText = 'Robô IA';
          p2Avatar.innerText = 'CPU';
        } else {
          p2Name.innerText = 'Treino';
          p2Avatar.innerText = 'TR';
        }
        this.updateUI();
      }

      resize() {
        const rect = this.container.getBoundingClientRect();
        let w = rect.width;
        let h = rect.height;

        // Proporção 2:1 da Mesa de Sinuca
        if (w / h > 2) {
          w = h * 2;
        } else {
          h = w / 2;
        }

        this.canvas.width = Math.max(300, Math.floor(w));
        this.canvas.height = Math.max(150, Math.floor(h));

        // Recalcular Limites
        const border = this.canvas.width * 0.05;
        this.tableBounds = {
          left: border,
          top: border,
          right: this.canvas.width - border,
          bottom: this.canvas.height - border,
          width: this.canvas.width - border * 2,
          height: this.canvas.height - border * 2
        };

        this.ballRadius = this.tableBounds.width / 70;

        // Caçapas nas 6 Posições
        const pocketRadius = this.ballRadius * 1.8;
        const tb = this.tableBounds;
        this.pockets = [
          { x: tb.left, y: tb.top, r: pocketRadius },
          { x: tb.left + tb.width / 2, y: tb.top - pocketRadius * 0.2, r: pocketRadius },
          { x: tb.right, y: tb.top, r: pocketRadius },
          { x: tb.left, y: tb.bottom, r: pocketRadius },
          { x: tb.left + tb.width / 2, y: tb.bottom + pocketRadius * 0.2, r: pocketRadius },
          { x: tb.right, y: tb.bottom, r: pocketRadius }
        ];

        if (this.balls.length === 0) {
          this.setupRack();
        }
      }

      resetGame() {
        this.currentPlayer = 1;
        this.p1Type = null;
        this.p2Type = null;
        this.turnState = 'aiming';
        this.power = 0;
        this.aimAngle = 0;
        this.pottedThisTurn = [];
        this.firstBallHit = null;
        this.foul = false;
        this.message = 'Sua Vez';

        document.getElementById('power-range').value = 0;
        document.getElementById('power-percentage').innerText = '0%';
        document.getElementById('potted-balls-container').innerHTML = '';

        this.setupRack();
        this.updateUI();
      }

      setupRack() {
        this.balls = [];
        const tb = this.tableBounds;
        
        // Bola Branca (0)
        const cueX = tb.left + tb.width * 0.25;
        const cueY = tb.top + tb.height * 0.5;
        this.balls.push(new Ball(0, cueX, cueY, this.ballRadius));

        // Triângulo de Bolas (1 a 15)
        const rackX = tb.left + tb.width * 0.7;
        const rackY = tb.top + tb.height * 0.5;
        const r = this.ballRadius;
        const dx = r * Math.sqrt(3) + 0.5;
        const dy = r + 0.5;

        // Distribuição clássica do Triângulo (8 no meio)
        const rackOrder = [
          1,
          10, 2,
          3, 8, 11,
          12, 5, 13, 4,
          14, 6, 15, 7, 9
        ];

        let index = 0;
        for (let col = 0; col < 5; col++) {
          for (let row = 0; row <= col; row++) {
            const bx = rackX + col * dx;
            const by = rackY + (row - col / 2) * dy * 2;
            const ballId = rackOrder[index++];
            this.balls.push(new Ball(ballId, bx, by, r));
          }
        }
      }

      setupEvents() {
        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: (clientX - rect.left) * (this.canvas.width / rect.width),
            y: (clientY - rect.top) * (this.canvas.height / rect.height)
          };
        };

        const handleStart = (pos) => {
          if (this.turnState === 'ballInHand') {
            const cue = this.balls[0];
            cue.x = Math.max(this.tableBounds.left + cue.radius, Math.min(this.tableBounds.right - cue.radius, pos.x));
            cue.y = Math.max(this.tableBounds.top + cue.radius, Math.min(this.tableBounds.bottom - cue.radius, pos.y));
            return;
          }

          if (this.turnState !== 'aiming') return;
          if (this.mode === 'cpu' && this.currentPlayer === 2) return;

          this.isMouseDown = true;
          this.dragStartPos = pos;
          this.mousePos = pos;
        };

        const handleMove = (pos) => {
          this.mousePos = pos;
          const cue = this.balls[0];

          if (this.turnState === 'ballInHand' && this.isMouseDown) {
            cue.x = Math.max(this.tableBounds.left + cue.radius, Math.min(this.tableBounds.right - cue.radius, pos.x));
            cue.y = Math.max(this.tableBounds.top + cue.radius, Math.min(this.tableBounds.bottom - cue.radius, pos.y));
            return;
          }

          if (this.turnState === 'aiming') {
            if (this.isMouseDown) {
              // Ajusta a Mira e Força arrastando
              const dx = pos.x - this.dragStartPos.x;
              const dy = pos.y - this.dragStartPos.y;
              const dist = Math.hypot(dx, dy);

              // Ângulo inverso ao arrasto (como um estilingue)
              this.aimAngle = Math.atan2(-dy, -dx);

              // Calcula força pelo arrasto
              this.power = Math.min(100, Math.max(0, (dist / 1.5)));
              document.getElementById('power-range').value = this.power;
              document.getElementById('power-percentage').innerText = `${Math.round(this.power)}%`;
            } else {
              // Mira direta pelo movimento do ponteiro
              this.aimAngle = Math.atan2(pos.y - cue.y, pos.x - cue.x);
            }
          }
        };

        const handleEnd = () => {
          if (this.turnState === 'ballInHand') {
            // Reposicionou a bola branca
            let collision = false;
            const cue = this.balls[0];
            for (let b of this.balls) {
              if (b.id !== 0 && b.active && Math.hypot(b.x - cue.x, b.y - cue.y) < b.radius + cue.radius) {
                collision = true;
                break;
              }
            }
            if (!collision) {
              this.turnState = 'aiming';
              this.message = this.currentPlayer === 1 ? 'Sua Vez' : 'Vez do Robô';
              this.updateUI();
            }
            this.isMouseDown = false;
            return;
          }

          if (this.isMouseDown && this.turnState === 'aiming') {
            this.isMouseDown = false;
            if (this.power > 5) {
              this.shoot();
            }
          }
        };

        // Eventos Mouse
        this.canvas.addEventListener('mousedown', (e) => handleStart(getPos(e)));
        window.addEventListener('mousemove', (e) => handleMove(getPos(e)));
        window.addEventListener('mouseup', () => handleEnd());

        // Eventos Touch (Mobile)
        this.canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          handleStart(getPos(e));
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
          handleMove(getPos(e));
        }, { passive: true });

        window.addEventListener('touchend', () => handleEnd());
      }

      shoot() {
        if (this.turnState !== 'aiming') return;

        const cue = this.balls[0];
        const speed = (this.power / 100) * 28;
        
        cue.vx = Math.cos(this.aimAngle) * speed;
        cue.vy = Math.sin(this.aimAngle) * speed;

        sfx.playHit(this.power / 100);

        this.turnState = 'moving';
        this.pottedThisTurn = [];
        this.firstBallHit = null;
        this.foul = false;

        this.power = 0;
        document.getElementById('power-range').value = 0;
        document.getElementById('power-percentage').innerText = '0%';
      }

      playCpuTurn() {
        this.message = 'Robô calculando...';
        this.updateUI();

        setTimeout(() => {
          const cue = this.balls[0];
          
          // Encontrar alvos válidos para a CPU
          let validTargets = this.balls.filter(b => {
            if (!b.active || b.isCue) return false;
            if (b.isEight) {
              // Só pode mirar na 8 se limpou a mesa
              const myType = this.currentPlayer === 1 ? this.p1Type : this.p2Type;
              const remaining = this.balls.filter(ball => ball.active && !ball.isCue && !ball.isEight &&
                ((myType === 'solid' && !ball.isStriped) || (myType === 'striped' && ball.isStriped))
              );
              return remaining.length === 0;
            }
            if (this.p2Type === 'solid') return !b.isStriped;
            if (this.p2Type === 'striped') return b.isStriped;
            return true;
          });

          if (validTargets.length === 0) validTargets = this.balls.filter(b => b.active && !b.isCue);

          // Escolher bola mais próxima
          let target = validTargets[0];
          let minDist = Infinity;
          for (let b of validTargets) {
            const d = Math.hypot(b.x - cue.x, b.y - cue.y);
            if (d < minDist) {
              minDist = d;
              target = b;
            }
          }

          if (target) {
            // Pequeno erro de precisão para parecer humano
            const angle = Math.atan2(target.y - cue.y, target.x - cue.x) + (Math.random() - 0.5) * 0.08;
            this.aimAngle = angle;
            this.power = 40 + Math.random() * 45;
            this.shoot();
          }
        }, 1000);
      }

      updatePhysics() {
        if (this.turnState !== 'moving') return;

        let ballsMoving = false;

        // Atualizar Posições
        for (let ball of this.balls) {
          if (!ball.active || ball.potted) continue;

          ball.update(this.friction);
          if (Math.hypot(ball.vx, ball.vy) > 0) ballsMoving = true;

          // Colisão com Caçapas
          for (let pocket of this.pockets) {
            if (Math.hypot(ball.x - pocket.x, ball.y - pocket.y) < pocket.r) {
              this.potBall(ball);
              break;
            }
          }

          // Colisão com Bordas
          const tb = this.tableBounds;
          if (ball.x - ball.radius < tb.left) {
            ball.x = tb.left + ball.radius;
            ball.vx *= -0.8;
            sfx.playCushion();
          } else if (ball.x + ball.radius > tb.right) {
            ball.x = tb.right - ball.radius;
            ball.vx *= -0.8;
            sfx.playCushion();
          }

          if (ball.y - ball.radius < tb.top) {
            ball.y = tb.top + ball.radius;
            ball.vy *= -0.8;
            sfx.playCushion();
          } else if (ball.y + ball.radius > tb.bottom) {
            ball.y = tb.bottom - ball.radius;
            ball.vy *= -0.8;
            sfx.playCushion();
          }
        }

        // Colisões entre Bolas
        for (let i = 0; i < this.balls.length; i++) {
          for (let j = i + 1; j < this.balls.length; j++) {
            const b1 = this.balls[i];
            const b2 = this.balls[j];

            if (!b1.active || !b2.active || b1.potted || b2.potted) continue;

            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);

            if (dist < b1.radius + b2.radius) {
              // Registra a primeira bola atingida pela branca
              if (b1.isCue && !this.firstBallHit) this.firstBallHit = b2;
              if (b2.isCue && !this.firstBallHit) this.firstBallHit = b1;

              // Som de colisão proporcional à velocidade
              const impactVel = Math.hypot(b1.vx - b2.vx, b1.vy - b2.vy);
              sfx.playHit(impactVel / 20);

              // Resolução de Sobreposição
              const overlap = (b1.radius + b2.radius) - dist;
              const nx = dx / dist;
              const ny = dy / dist;

              b1.x -= nx * overlap * 0.5;
              b1.y -= ny * overlap * 0.5;
              b2.x += nx * overlap * 0.5;
              b2.y += ny * overlap * 0.5;

              // Físicas de Colisão Elástica 2D
              const kx = b1.vx - b2.vx;
              const ky = b1.vy - b2.vy;
              const p = 2 * (nx * kx + ny * ky) / 2;

              b1.vx -= p * nx;
              b1.vy -= p * ny;
              b2.vx += p * nx;
              b2.vy += p * ny;
            }
          }
        }

        // Quando todas as bolas pararem
        if (!ballsMoving) {
          this.evaluateTurn();
        }
      }

      potBall(ball) {
        ball.potted = true;
        ball.vx = 0;
        ball.vy = 0;
        sfx.playPocket();

        if (ball.isCue) {
          this.foul = true;
        } else {
          this.pottedThisTurn.push(ball);
          this.addPottedBallToUI(ball.id);
        }
      }

      addPottedBallToUI(ballId) {
        const container = document.getElementById('potted-balls-container');
        const badge = document.createElement('div');
        badge.className = 'w-5 h-5 rounded-full flex items-center justify-center font-bold text-[9px] shadow-md border border-white/20 flex-shrink-0';
        badge.style.backgroundColor = BALL_COLORS[ballId];
        badge.style.color = ballId === 1 || ballId === 9 ? '#000' : '#FFF';
        badge.innerText = ballId;
        container.appendChild(badge);
      }

      evaluateTurn() {
        const cue = this.balls[0];

        // 1. Bola Branca Encaçapada (Falta)
        if (cue.potted) {
          cue.potted = false;
          cue.active = true;
          cue.vx = 0;
          cue.vy = 0;
          cue.x = this.tableBounds.left + this.tableBounds.width * 0.25;
          cue.y = this.tableBounds.top + this.tableBounds.height * 0.5;
          this.foul = true;
        }

        // 2. Não tocou em nenhuma bola (Falta)
        if (!this.firstBallHit && !this.foul) {
          this.foul = true;
        }

        // 3. Bola 8 Encaçapada
        const pottedEight = this.pottedThisTurn.find(b => b.isEight);
        if (pottedEight) {
          const myType = this.currentPlayer === 1 ? this.p1Type : this.p2Type;
          const myBallsLeft = this.balls.filter(b => b.active && !b.potted && !b.isCue && !b.isEight &&
            ((myType === 'solid' && !b.isStriped) || (myType === 'striped' && b.isStriped))
          );

          if (myBallsLeft.length === 0 && !this.foul) {
            this.endGame(this.currentPlayer === 1 ? 'Você Venceu! 🎉' : 'Robô Venceu! 🤖');
          } else {
            this.endGame(this.currentPlayer === 1 ? 'Falta na Bola 8! Você Perdeu.' : 'Robô cometeu falta na Bola 8! Você Venceu! 🎉');
          }
          return;
        }

        // 4. Atribuir Grupos (Lisas / Listradas) no primeiro encaçapamento
        if (!this.p1Type && this.pottedThisTurn.length > 0) {
          const validBall = this.pottedThisTurn.find(b => !b.isCue && !b.isEight);
          if (validBall) {
            if (this.currentPlayer === 1) {
              this.p1Type = validBall.isStriped ? 'striped' : 'solid';
              this.p2Type = validBall.isStriped ? 'solid' : 'striped';
            } else {
              this.p2Type = validBall.isStriped ? 'striped' : 'solid';
              this.p1Type = validBall.isStriped ? 'solid' : 'striped';
            }
          }
        }

        // 5. Determinar se mantém o turno ou passa a vez
        let continueTurn = false;
        if (!this.foul && this.pottedThisTurn.length > 0) {
          const myType = this.currentPlayer === 1 ? this.p1Type : this.p2Type;
          if (!myType) {
            continueTurn = true;
          } else {
            const scoredCorrect = this.pottedThisTurn.some(b =>
              (myType === 'solid' && !b.isStriped) || (myType === 'striped' && b.isStriped)
            );
            if (scoredCorrect) continueTurn = true;
          }
        }

        if (this.mode === 'practice') {
          this.turnState = this.foul ? 'ballInHand' : 'aiming';
          this.message = this.foul ? 'Falta! Bola na Mão' : 'Sua Vez';
        } else {
          // Modo VS CPU
          if (this.foul) {
            this.switchPlayer();
            this.turnState = 'ballInHand';
            this.message = `Falta! Bola na Mão (${this.currentPlayer === 1 ? 'Sua Vez' : 'Robô'})`;
          } else if (continueTurn) {
            this.turnState = 'aiming';
            this.message = this.currentPlayer === 1 ? 'Sua Vez (Continua)' : 'Vez do Robô (Continua)';
          } else {
            this.switchPlayer();
            this.turnState = 'aiming';
            this.message = this.currentPlayer === 1 ? 'Sua Vez' : 'Vez do Robô';
          }

          if (this.currentPlayer === 2 && this.turnState === 'aiming') {
            this.playCpuTurn();
          }
        }

        this.updateUI();
      }

      switchPlayer() {
        this.currentPlayer = this.currentPlayer === 1 ? 2 : 1;
      }

      endGame(msg) {
        this.turnState = 'gameOver';
        this.message = msg;
        this.updateUI();
        alert(msg);
      }

      updateUI() {
        const statusBadge = document.getElementById('status-badge');
        statusBadge.innerText = this.message;

        const p1Card = document.getElementById('p1-card');
        const p2Card = document.getElementById('p2-card');
        const p1TypeLabel = document.getElementById('p1-type');
        const p2TypeLabel = document.getElementById('p2-type');

        const getTypeStr = (t) => t === 'solid' ? 'Lisas (1-7)' : t === 'striped' ? 'Listradas (9-15)' : 'Qualquer Bola';

        p1TypeLabel.innerText = getTypeStr(this.p1Type);
        p2TypeLabel.innerText = getTypeStr(this.p2Type);

        if (this.currentPlayer === 1) {
          p1Card.className = 'flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-emerald-950/80 border border-emerald-500 shadow-lg';
          p2Card.className = 'flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-gray-800/40 border border-transparent opacity-60';
        } else {
          p2Card.className = 'flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-blue-950/80 border border-blue-500 shadow-lg';
          p1Card.className = 'flex items-center gap-2 p-1.5 md:p-2 rounded-lg bg-gray-800/40 border border-transparent opacity-60';
        }
      }

      drawTable() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const tb = this.tableBounds;

        // Fundo Madeira/Borda da Mesa
        ctx.fillStyle = '#2d1810';
        ctx.fillRect(0, 0, w, h);

        // Moldura Interna da Mesa
        ctx.fillStyle = '#422213';
        ctx.fillRect(tb.left - 10, tb.top - 10, tb.width + 20, tb.height + 20);

        // Feltro Verde da Mesa
        ctx.fillStyle = '#0f6338';
        ctx.fillRect(tb.left, tb.top, tb.width, tb.height);

        // Linha de Cabeceira (Baulk Line)
        ctx.beginPath();
        ctx.moveTo(tb.left + tb.width * 0.25, tb.top);
        ctx.lineTo(tb.left + tb.width * 0.25, tb.bottom);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Caçapas
        for (let p of this.pockets) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = '#050505';
          ctx.fill();
          ctx.strokeStyle = '#1f1f1f';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      drawCue() {
        if (this.turnState !== 'aiming' && this.turnState !== 'ballInHand') return;
        if (this.mode === 'cpu' && this.currentPlayer === 2) return;

        const cue = this.balls[0];
        const ctx = this.ctx;

        // Linha Guia de Mira
        const lineLen = 300;
        const targetX = cue.x + Math.cos(this.aimAngle) * lineLen;
        const targetY = cue.y + Math.sin(this.aimAngle) * lineLen;

        ctx.beginPath();
        ctx.moveTo(cue.x, cue.y);
        ctx.lineTo(targetX, targetY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Desenhar Taco de Madeira
        const pullBack = (this.power / 100) * 40 + 15;
        const cueLen = Math.min(this.canvas.width * 0.4, 250);
        
        const startX = cue.x - Math.cos(this.aimAngle) * (cue.radius + pullBack);
        const startY = cue.y - Math.sin(this.aimAngle) * (cue.radius + pullBack);
        
        const endX = startX - Math.cos(this.aimAngle) * cueLen;
        const endY = startY - Math.sin(this.aimAngle) * cueLen;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 5;
        ctx.stroke();
        ctx.restore();
      }

      loop() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        this.drawTable();
        this.updatePhysics();

        // Desenhar Bolas
        for (let ball of this.balls) {
          ball.draw(this.ctx);
        }

        // Desenhar Taco / Mira
        this.drawCue();

        requestAnimationFrame(() => this.loop());
      }
    }

    // Inicializar o Jogo ao Carregar a Página
    window.addEventListener('DOMContentLoaded', () => {
      new Game();
    });
  </script>
</body>
