<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tux Fighter</title>
<style>
:root{--bg:#e9eef5;--pn:#fff;--fg:#111827;--mut:#5b6678;--bd:#c3ccd8;--ac:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e14;--pn:#141b26;--fg:#e6edf3;--mut:#8b98a9;--bd:#2a3647;--ac:#f5c518}}
:root[data-theme="dark"]{--bg:#0a0e14;--pn:#141b26;--fg:#e6edf3;--mut:#8b98a9;--bd:#2a3647;--ac:#f5c518}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:6px 0;color:var(--ac);font-size:clamp(22px,6vw,42px);letter-spacing:2px}
#menu{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%;max-width:620px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.card{background:var(--pn);border:2px solid var(--bd);border-radius:8px;color:var(--fg);padding:4px;cursor:pointer;font:inherit;font-size:13px;font-weight:bold}
.card:hover{border-color:var(--ac)}
.card canvas{width:100%;aspect-ratio:90/110}
.card small{display:block;color:var(--mut);font-size:10px;font-weight:normal}
#hint{font-size:12px;color:var(--mut);line-height:1.5}
#game{display:none;width:100%;max-width:900px}
canvas#g{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:8px}
.pad{display:none;justify-content:space-between;padding:10px 4px;touch-action:none}
@media (hover:none){.pad{display:flex}}
.pad div{display:flex;gap:8px}
.pad button{width:58px;height:58px;border-radius:50%;border:2px solid var(--bd);background:var(--pn);color:var(--fg);font-size:22px;touch-action:none}
.pad button:active{border-color:var(--ac)}
</style></head><body>
<div id="menu">
<h1>🐧 TUX FIGHTER</h1>
<div style="color:var(--mut)">Escolha seu lutador do ecossistema open source</div>
<div class="cards" id="cards"></div>
<div id="hint">A/D ou setas: mover · W: pular · S: defender<br>J ou Z: soco · K ou X: chute · L ou C: especial (barra amarela cheia)<br>Melhor de 3 rounds contra a CPU</div>
</div>
<div id="game">
<canvas id="g"></canvas>
<div class="pad">
<div><button data-k="l">◀</button><button data-k="r">▶</button><button data-k="u">▲</button><button data-k="d">🛡</button></div>
<div><button data-k="p">👊</button><button data-k="k">🦶</button><button data-k="s">⚡</button></div>
</div></div>
<script>
const W=800,H=450,GY=380,cv=document.getElementById('g'),c=cv.getContext('2d');cv.width=W;cv.height=H;
const CH=[
{n:'Tux',id:0,c:'#232830',b:'#fff',ft:'#f59e0b',spd:4.2,pw:1,sp:'sudo!',sc:'#4ade80',d:'Equilibrado'},
{n:'GNU',id:1,c:'#8a5a2b',b:'#f3e2c0',ft:'#4a3320',spd:3.4,pw:1.25,sp:'GPL!',sc:'#a78bfa',d:'Pesado'},
{n:'Konqi',id:2,c:'#3fa34d',b:'#d9f2a6',ft:'#2c7a37',spd:4.7,pw:.95,sp:'KDE!',sc:'#60a5fa',d:'Veloz'},
{n:'Beastie',id:3,c:'#d62f2f',b:'#f39a8a',ft:'#222',spd:4,pw:1.1,sp:'BSD!',sc:'#fb923c',d:'Rival BSD'}];
const A={punch:{dur:16,on:5,rng:58,dmg:6,kb:4},kick:{dur:25,on:9,rng:78,dmg:10,kb:8},special:{dur:30,on:12}};
let P,E,sel,en,prj=[],pts=[],shake=0,mode='menu',timer=0,wins=[0,0],round=1,msg='',mt=0,fr=0;
// ---------- entrada
const KM={KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyJ:'p',KeyZ:'p',KeyK:'k',KeyX:'k',KeyL:'s',KeyC:'s'};
const I={l:0,r:0,u:0,d:0,p:0,k:0,s:0};
addEventListener('keydown',e=>{const a=KM[e.code];if(a){I[a]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const a=KM[e.code];if(a)I[a]=0});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;
b.onpointerdown=e=>{e.preventDefault();I[k]=1};
['onpointerup','onpointerleave','onpointercancel'].forEach(v=>b[v]=()=>I[k]=0);
b.oncontextmenu=e=>e.preventDefault()});
let AC;function snd(f,d,w){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=w||'square';o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
// ---------- desenho do lutador
function drawF(x,y,ch,face,st,f,at,dur,ctx){
ctx.save();ctx.translate(x,y);ctx.scale(face,1);
const ko=st=='ko',a=A[st]?Math.sin(Math.PI*at/dur):0,wk=st=='walk'?Math.sin(f/3)*7:0,bob=st=='idle'?Math.sin(f/9)*1.5:0,air=st=='jump'?10:0;
if(ko)ctx.rotate(-1.35);if(st=='hit')ctx.rotate(-.18);
ctx.lineWidth=2;ctx.strokeStyle='#000a';ctx.lineCap='round';
const el=(x,y,rx,ry,col,r)=>{ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,r||0,0,7);ctx.fill();ctx.stroke()};
const limb=(x1,y1,x2,y2,w,col)=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle='#000a';ctx.lineWidth=w+3;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#000a'};
const id=ch.id;
if(id==2)el(-27,-22,15,6,ch.c,.5);
if(id==3){limb(-20,-24,-42,-34,4,ch.c);limb(-42,-34,-40,-52,4,ch.c)}
el(-12-wk,-5-air,12,6,ch.ft);
el(-14,-44+bob,6,13,ch.c,.3);
if(id==1){ctx.strokeStyle='#e8dcc0';ctx.lineWidth=5;[-2,14].forEach(h=>{ctx.beginPath();ctx.moveTo(h,-70);ctx.quadraticCurveTo(h-14,-92,h+4,-94);ctx.stroke()});ctx.lineWidth=2;ctx.strokeStyle='#000a'}
if(id==2){ctx.fillStyle='#e53e3e';for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(-8+k*10,-72);ctx.lineTo(-3+k*10,-86);ctx.lineTo(2+k*10,-72);ctx.fill()}}
if(id==3){ctx.fillStyle='#111';[[-4,-8],[14,6]].forEach(([h,d])=>{ctx.beginPath();ctx.moveTo(h,-72);ctx.lineTo(h+d,-90);ctx.lineTo(h+8,-72);ctx.fill()})}
el(0,-40+bob,26,36,ch.c);el(5,-36+bob,16,27,ch.b);
if(id==0){el(18,-54+bob,11,4.5,'#f59e0b');el(17,-49+bob,8,3.5,'#e08a00')}
if(id==1){el(19,-56+bob,9,6,'#a8763b');ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(10,-52);ctx.lineTo(27,-50);ctx.lineTo(16,-33);ctx.fill()}
if(id==2){el(20,-55+bob,10,6,'#58bb63');ctx.fillStyle='#000';ctx.fillRect(24,-57+bob,2,2)}
if(id==3)el(19,-55+bob,8,5,ch.b);
[4,17].forEach(ex=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,-64+bob,5,0,7);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex+1.8,-64+bob,2.3,0,7);ctx.fill()});
if(A[st]||st=='hit'){ctx.beginPath();ctx.moveTo(0,-72);ctx.lineTo(22,-st=='hit'?72:67);ctx.lineWidth=2.5;ctx.strokeStyle='#000';ctx.stroke()}
if(st=='kick'){limb(8,-16,8+a*58,-16-a*22,10,ch.ft);el(10+a*58,-16-a*22,9,6,ch.ft)}else el(12+wk,-5-air,12,6,ch.ft);
if(st=='punch'){limb(14,-50,14+a*44,-52,9,ch.c);el(16+a*44,-52,7,7,ch.c)}
else if(st=='special'){limb(14,-50,36,-50,9,ch.c);ctx.fillStyle=ch.sc;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(46,-50,8+a*10,0,7);ctx.fill();ctx.globalAlpha=1}
else if(st=='block'){limb(14,-30,22,-68,9,ch.c);ctx.strokeStyle='#7cf';ctx.lineWidth=3;ctx.beginPath();ctx.arc(14,-48,34,-1.1,1.1);ctx.stroke()}
else{limb(14,-48,20,-30+wk*.5,8,ch.c);
if(id==3&&!ko){limb(21,-30,27,-92,3,'#8b5a2b');limb(21,-92,33,-92,3,'#ccc');limb(21,-92,21,-102,3,'#ccc');limb(33,-92,33,-102,3,'#ccc');limb(27,-92,27,-104,3,'#ccc')}}
ctx.restore()}
// ---------- lutadores
const mk=(ch,x,face)=>({ch,x,y:GY,vx:0,vy:0,face,hp:100,en:0,st:'idle',t:0,at:0,dur:0,did:0,fr:0,ait:0,plan:''});
function newRound(){P=mk(CH[sel],220,1);E=mk(CH[en],580,-1);prj=[];pts=[];timer=3600;mode='intro';mt=110}
function startMatch(i){sel=i;do{en=Math.random()*4|0}while(en==i);wins=[0,0];round=1;newRound();
document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block'}
function go(f,t){f.st=t;f.at=0;f.did=0;f.dur=A[t].dur;if(t=='special')f.en-=50}
function burst(x,y,col,n){for(let i=0;i<n;i++)pts.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.8)*7,l:25,col})}
function hurt(o,dmg,dir,kb,by){
if(mode!='fight'||o.st=='ko')return;
if(o.st=='block'&&(by.x-o.x)*o.face>0){dmg=Math.max(1,Math.round(dmg*.2));o.vx=dir*2;burst(o.x+o.face*22,o.y-50,'#7cf',6);snd(150,.06)}
else{o.st='hit';o.t=13;o.vx=dir*kb;burst(o.x,o.y-55,'#ffd24a',12);snd(90,.1);shake=Math.min(12,dmg);by.en=Math.min(100,by.en+dmg*1.6);o.en=Math.min(100,o.en+dmg*.6)}
o.hp=Math.max(0,o.hp-dmg);
if(o.hp<=0){o.st='ko';o.vy=-9;o.vx=dir*5;roundEnd(by)}}
function fire(f,o){
const a=A[f.st];
if(f.st=='special'){prj.push({x:f.x+f.face*40,y:f.y-50,vx:f.face*8,o:f,col:f.ch.sc,tx:f.ch.sp});snd(220,.18,'sawtooth');return}
const d=(o.x-f.x)*f.face;
if(d>-10&&d<a.rng+20&&Math.abs(o.y-f.y)<55)hurt(o,Math.round(a.dmg*f.ch.pw),f.face,a.kb,f)}
function upd(f,o,i){
const g=f.y>=GY,ch=f.ch;f.fr++;
if(f.st!='ko'){
if(f.st=='hit'){if(--f.t<=0)f.st='idle'}
else if(f.st in A){f.at++;if(f.at==A[f.st].on&&!f.did){f.did=1;fire(f,o)}if(f.at>=f.dur)f.st='idle';if(g)f.vx*=.7}
else{
f.st=g?'idle':'jump';
if(g&&i.d){f.st='block';f.vx=0}
else{const m=(i.r?1:0)-(i.l?1:0);
if(g){f.vx=m*ch.spd;if(m)f.st='walk'}else if(m)f.vx=m*ch.spd*.9;
if(i.u&&g){f.vy=-13.5;f.st='jump'}
if(i.p)go(f,'punch');else if(i.k)go(f,'kick');else if(i.s&&f.en>=50)go(f,'special')}}
if(!(f.st in A)&&f.st!='hit'&&g)f.face=o.x>f.x?1:-1}
f.x+=f.vx;f.y+=f.vy;f.vy+=.75;
if(f.y>=GY){f.y=GY;f.vy=0;if(f.st=='hit'||f.st=='ko')f.vx*=.88}
f.x=Math.max(30,Math.min(W-30,f.x));
const dx=f.x-o.x;if(Math.abs(dx)<34&&Math.abs(f.y-o.y)<50&&f.st!='ko'&&o.st!='ko')f.x+=Math.sign(dx||1)*2.5}
function ai(f,o){
const d=Math.abs(o.x-f.x),t=o.x>f.x?'r':'l',b=t=='r'?'l':'r',i={};
if(--f.ait<=0){f.ait=(8+Math.random()*14-round*2)|0;const r=Math.random();
f.plan=d>200?(r<.15&&f.en>=50?'s':r<.2?'u':'go'):d>95?(r<.6?'go':r<.75?'k':r<.85?'u':'w'):(r<.3?'p':r<.5?'k':r<.7?'d':r<.85?'back':'u')}
if(o.st in A&&o.st!='special'&&d<110&&Math.random()<.02+round*.01){f.plan='d';f.ait=12}
if(prj.some(p=>p.o==P&&Math.abs(p.x-f.x)<140)&&f.y>=GY&&Math.random()<.04)f.plan='u';
const p=f.plan;
if(p=='go')i[t]=1;else if(p=='back')i[b]=1;else if(p=='u'){i.u=1;i[t]=1}else if(p!='w')i[p]=1;
return i}
function roundEnd(w){mode='end';mt=170;
if(w){wins[w==P?0:1]++;msg='K.O.!'}else msg='EMPATE';
if(wins[0]>=2){msg='VOCE VENCEU!';mt=220}else if(wins[1]>=2){msg='VOCE PERDEU';mt=220}}
function next(){if(wins[0]>=2||wins[1]>=2){mode='menu';document.getElementById('game').style.display='none';document.getElementById('menu').style.display='flex'}else{round++;newRound()}}
function step(){
if(mode=='menu')return;
fr++;shake*=.85;
if(mode=='intro'){mt--;msg=mt>45?'ROUND '+round:'FIGHT!';if(mt<=0)mode='fight'}
const live=mode=='fight';
upd(P,E,live?I:{});upd(E,P,live?ai(E,P):{});
prj=prj.filter(p=>{p.x+=p.vx;const o=p.o==P?E:P;
if(Math.abs(p.x-o.x)<30&&Math.abs(p.y-(o.y-45))<50){hurt(o,Math.round(14*p.o.ch.pw),Math.sign(p.vx),9,p.o);burst(p.x,p.y,p.col,14);return false}
return p.x>-40&&p.x<W+40});
pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--});pts=pts.filter(p=>p.l>0);
if(live){P.en=Math.min(100,P.en+.03);E.en=Math.min(100,E.en+.03);
if(--timer<=0){roundEnd(P.hp==E.hp?null:P.hp>E.hp?P:E);msg=P.hp==E.hp?'EMPATE':'TEMPO!';if(wins[0]>=2)msg='VOCE VENCEU!';if(wins[1]>=2)msg='VOCE PERDEU'}}
if(mode=='end'&&--mt<=0)next()}
// ---------- cenario e HUD
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');
const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0f1a');g.addColorStop(1,'#16233a');b.fillStyle=g;b.fillRect(0,0,W,H);
const L=['$ sudo apt install tux','$ make -j8 kernel','$ git push origin master','$ rm -rf /  # nao!','[ OK ] Started Fight Daemon','$ chmod +x fight.sh','$ ./configure && make','$ ls -la /dev/null','Segmentation fault (core dumped)','$ cat /proc/cpuinfo','$ grep -r bug .','$ systemctl restart ring'];
b.font='12px monospace';for(let i=0;i<22;i++){b.fillStyle=i%5?'#2e7d5a66':'#3b82f64d';b.fillText(L[i%12],20+(i*137)%560,100+i*12)}
b.font='bold 58px monospace';b.fillStyle='#ffffff0a';b.fillText('/dev/null ARENA',130,300);
b.fillStyle='#0e1624';b.fillRect(0,GY,W,H-GY);
b.strokeStyle='#22c55e';b.lineWidth=2;b.beginPath();b.moveTo(0,GY);b.lineTo(W,GY);b.stroke();
b.strokeStyle='#22c55e22';b.lineWidth=1;b.beginPath();
for(let x=-400;x<1200;x+=80){b.moveTo(400+(x-400)*.2,GY);b.lineTo(x,H)}
[GY+12,GY+30,GY+55].forEach(y=>{b.moveTo(0,y);b.lineTo(W,y)});b.stroke()})();
function hud(){
const bw=330;c.textAlign='left';
[[P,20,0],[E,W-20-bw,1]].forEach(([f,x,s])=>{
c.fillStyle='#000a';c.fillRect(x-3,17,bw+6,24);c.fillStyle='#3a1111';c.fillRect(x,20,bw,18);
const w=bw*f.hp/100;c.fillStyle=f.hp>30?'#22c55e':'#ef4444';c.fillRect(s?x+bw-w:x,20,w,18);
const ew=bw*.6,ex=s?x+bw-ew:x;c.fillStyle='#0008';c.fillRect(ex,44,ew,8);
c.fillStyle=f.en>=50?'#facc15':'#3b82f6';const e=ew*f.en/100;c.fillRect(s?ex+ew-e:ex,44,e,8);
c.fillStyle='#fff';c.font='bold 14px monospace';c.textAlign=s?'right':'left';c.fillText(f.ch.n+(s?' (CPU)':''),s?x+bw:x,68);
for(let k=0;k<2;k++){c.beginPath();c.arc(s?x+bw-8-k*18:x+8+k*18,80,6,0,7);c.fillStyle=wins[s]>k?'#facc15':'#0008';c.fill();c.strokeStyle='#fff';c.lineWidth=1;c.stroke()}});
c.textAlign='center';c.fillStyle='#fff';c.font='bold 34px monospace';c.fillText(Math.ceil(timer/60),W/2,46)}
function draw(){
c.save();if(shake>.5)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
c.drawImage(bg,0,0);
[E,P].forEach(f=>{c.fillStyle='#0007';c.beginPath();c.ellipse(f.x,GY+5,Math.max(8,28-(GY-f.y)/6),6,0,0,7);c.fill();
if(f.en>=50&&mode=='fight'){c.strokeStyle=f.ch.sc;c.globalAlpha=.4+.3*Math.sin(fr/4);c.lineWidth=3;c.beginPath();c.ellipse(f.x,f.y-40,34,52,0,0,7);c.stroke();c.globalAlpha=1}
drawF(f.x,f.y,f.ch,f.face,f.st,f.fr,f.at,f.dur||1,c)});
c.fillStyle='#facc15';c.font='bold 12px monospace';c.textAlign='center';c.fillText('▼ P1',P.x,P.y-108);
prj.forEach(p=>{c.save();c.shadowColor=p.col;c.shadowBlur=18;c.fillStyle=p.col;c.beginPath();c.ellipse(p.x,p.y,25,13,0,0,7);c.fill();c.restore();c.fillStyle='#000';c.font='bold 12px monospace';c.textAlign='center';c.fillText(p.tx,p.x,p.y+4)});
pts.forEach(p=>{c.globalAlpha=p.l/25;c.fillStyle=p.col;c.fillRect(p.x,p.y,4,4)});c.globalAlpha=1;
c.restore();hud();
if(mode=='intro'||mode=='end'){c.save();c.textAlign='center';c.font='bold '+(msg=='FIGHT!'?72+Math.sin(fr/3)*6:56)+'px monospace';c.lineWidth=7;c.strokeStyle='#000';c.strokeText(msg,W/2,200);c.fillStyle='#facc15';c.fillText(msg,W/2,200);c.restore()}}
// ---------- menu e loop
CH.forEach((ch,i)=>{const b=document.createElement('button');b.className='card';
b.innerHTML='<canvas width="90" height="110"></canvas>'+ch.n+'<small>'+ch.d+'</small>';
const x=b.firstChild.getContext('2d');x.scale(.9,.9);drawF(45,112,ch,1,'idle',0,0,1,x);
b.onclick=()=>startMatch(i);document.getElementById('cards').appendChild(b)});
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(50,t-last);last=t;while(acc>=16.67){step();acc-=16.67}if(mode!='menu')draw()}
requestAnimationFrame(loop);
</script></body></html>
